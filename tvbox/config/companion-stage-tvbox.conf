# The TV box's screen (tvbox/README.md): Weston's kiosk shell instead of cage, so the picture's size can be
# chosen whatever the screen would like. A drop-in, which software updates leave alone: they replace
# companion-stage.service itself, whose arguments for the character's program stage-in-weston reads from it.
[Service]
# COMPANION_SCREEN_MODE and COMPANION_SCREEN_ROTATE, for the screen's settings.
EnvironmentFile=-/etc/default/companion
# The picture's size and turn, worked out at each start from the screen plugged in (as root, for /run).
ExecStartPre=+/usr/local/lib/companion-tvbox/companion-tvbox-screen
ExecStart=
ExecStart=/usr/bin/weston --config=/run/companion-tvbox/weston.ini
# Weston and the character's program together.
MemoryMax=450M
