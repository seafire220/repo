# The TV box's screen (tvbox/README.md): Weston's kiosk shell instead of cage, so the picture can be set to
# 1920x1080 whatever the TV prefers (/etc/companion/weston.ini). A drop-in, which software updates leave
# alone: they replace companion-stage.service itself, whose arguments for the character's program
# stage-in-weston reads from it.
[Service]
ExecStart=
ExecStart=/usr/bin/weston --config=/etc/companion/weston.ini
# Weston and the character's program together.
MemoryMax=450M
