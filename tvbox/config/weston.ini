# The TV box's screen (tvbox/README.md): Weston's kiosk shell shows one program, the character, full-screen.
# Installed as /etc/companion/weston.ini by tvbox/install.sh, which leaves a copy you have edited alone.

[core]
shell=kiosk-shell.so
# Never fade the picture by itself: the device sleeps the screen at night when you ask it to (Device tab).
idle-time=0
# Start with no keyboard or mouse plugged in (a remote alone, or nothing at all).
require-input=false

[output]
name=HDMI-A-1
# 1920x1080 whatever the TV would like: a 4K picture is four times the work, too much for the box's graphics.
# With no rate given, the fastest 1080p the TV offers (60 Hz, or 59.94 on TVs without exactly 60). A monitor
# with no 1080p picture uses its own best one.
mode=1920x1080
# A monitor stood on its side, for a tall picture like the Pi's screen: remove the # on the next line.
#transform=rotate-90

[autolaunch]
path=/usr/local/lib/companion-tvbox/stage-in-weston
# Weston stops when the character's program does (it does when the character changes), and the service
# manager starts both again.
watch=true
