# The TV box's screen (tvbox/README.md): Weston's kiosk shell shows one program, the character, full-screen.
# Installed as /etc/companion/weston.ini by tvbox/install.sh, which leaves a copy you have edited alone. Each
# time the screen starts, bin/companion-tvbox-screen copies it to /run/companion-tvbox/weston.ini with the
# picture's size and turn filled in, and Weston reads that copy.

[core]
shell=kiosk-shell.so
# Never fade the picture by itself: the device sleeps the screen at night when you ask it to (Device tab).
idle-time=0
# Start with no keyboard or mouse plugged in (a remote alone, or nothing at all).
require-input=false

[output]
name=HDMI-A-1
# auto: the screen's own size (a 7-inch screen's 1024x600, a monitor's 1920x1080), but never more than
# 1920x1080 (a 4K picture is four times the work, too much for the box's graphics; a 4K TV gets 1080p at its
# fastest rate). Or a size of your choosing, such as mode=1280x720 (or COMPANION_SCREEN_MODE in
# /etc/default/companion).
mode=auto
# A screen stood on its side, for a tall picture like the Pi's: remove the # on the next line (rotate-270 if
# the picture is upside down), or set COMPANION_SCREEN_ROTATE=90 in /etc/default/companion.
#transform=rotate-90

[autolaunch]
path=/usr/local/lib/companion-tvbox/stage-in-weston
# Weston stops when the character's program does (it does when the character changes), and the service
# manager starts both again.
watch=true
