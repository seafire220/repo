[package]
name = "stage"
version = "0.1.0"
edition = "2021"
publish = false
description = "Draws and animates the character on the device screen"

[dependencies]
inox2d = { path = "vendor/inox2d" }
inox2d-opengl = { path = "vendor/inox2d-opengl" }
ayagami = { path = "vendor/ayagami" }
glam = "0.29.0"
glow = "0.14.1"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
winit = "0.30.13"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
strip = true
