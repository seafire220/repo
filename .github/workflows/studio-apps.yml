name: Make the Character Studio apps

# Builds Character Studio as an app for each system, each with its own Python inside
# (studio/packaging/build_app.py), then installs it the way a buyer would and runs it with --self-test:
# the first start downloads its AI tools, its page answers, the studio starts and answers, and Quit stops it.
#
#   Windows: CharacterStudio-Setup-<version>.exe     macOS: CharacterStudio-<version>.dmg
#   Linux:   CharacterStudio-<version>-x86_64.AppImage
#
# Run it from Actions -> "Make the Character Studio apps" -> Run workflow, with a version. The apps are
# then on a GitHub release, "Character Studio <version>" (Releases, on the repository's front page):
# a draft only you can see, until you publish it there (or choose "publish" here). A published release
# becomes the repository's latest, so these links always give the newest apps:
#   https://github.com/seafire220/repo/releases/latest/download/CharacterStudio-Setup.exe
#   https://github.com/seafire220/repo/releases/latest/download/CharacterStudio.dmg
#   https://github.com/seafire220/repo/releases/latest/download/CharacterStudio-x86_64.AppImage
# It also runs, with a test version number and no release, when the app's files change; those builds are
# on the run's page under Artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 2026.11.21"
        required: true
      release:
        description: "The GitHub release: a draft to check first, published at once, or none (Artifacts only)"
        required: true
        default: draft
        type: choice
        options: [draft, publish, none]
  push:
    branches: [main]
    paths:
      - "studio/launch.py"
      - "studio/app.py"
      - "studio/app/**"
      - "studio/requirements*.txt"
      - "studio/packaging/**"
      - ".github/workflows/studio-apps.yml"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  PYTHON_VERSION: "3.12"
  # The AppImage runtime at a fixed release, the one studio/packaging/appimage-runtime-licences.txt
  # describes (its libfuse is LGPL-2.1: its source is published with each Linux app).
  RUNTIME_TAG: "20251108"
  RUNTIME_COMMIT: dd6cebedcbddde9c82f89b011e8e1d40b6e43868
  RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the app's own Python and Inno Setup
        run: |
          python -m pip install --quiet uv
          python -m uv python install $env:PYTHON_VERSION --install-dir "$env:RUNNER_TEMP\pythons"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not installed" }
      - name: Build the installer
        run: |
          $py = (Get-ChildItem "$env:RUNNER_TEMP\pythons" -Directory | Where-Object Name -like "cpython-*-windows-*" | Select-Object -First 1).FullName
          python studio/packaging/build_app.py --python $py --version $env:VERSION --out "$env:RUNNER_TEMP\dist" --iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Get-ChildItem "$env:RUNNER_TEMP\dist\*.exe" | Format-Table Name, Length
      - name: Install it as a buyer would
        run: |
          $setup = "$env:RUNNER_TEMP\dist\CharacterStudio-Setup-$env:VERSION.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer stopped with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Character Studio"
          if (-not (Test-Path "$app\python\pythonw.exe")) { throw "not installed where expected" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Character Studio.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu icon" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($menu)
          "Start menu icon runs: $($link.TargetPath) $($link.Arguments)"
      - name: Start it as its icon does, first time (downloads its tools) and again
        env:
          CHARACTER_STUDIO_HOME: ${{ runner.temp }}\character-studio
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Character Studio"
          & "$app\python\python.exe" -I -B "$app\studio\launch.py" --self-test
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:CHARACTER_STUDIO_HOME\launcher.log" -Tail 60; throw "self-test failed" }
          # The icon's own program (no console window) must manage too.
          $p = Start-Process -FilePath "$app\python\pythonw.exe" -ArgumentList '-I', '-B', "`"$app\studio\launch.py`"", '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:CHARACTER_STUDIO_HOME\launcher.log" -Tail 60; throw "self-test with pythonw failed ($($p.ExitCode))" }
          Get-Content "$env:CHARACTER_STUDIO_HOME\launcher.log" -Tail 8
      - name: Uninstall leaves nothing behind but the downloads (kept unless asked)
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Character Studio"
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself: wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\python"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\python") { throw "the app is still there after uninstalling" }
          if (-not (Test-Path "$env:RUNNER_TEMP\character-studio")) { throw "the downloads were deleted without being asked" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Character Studio.lnk") { throw "the icon is still there" }
      - uses: actions/upload-artifact@v4
        with:
          name: character-studio-windows-${{ env.VERSION }}
          path: ${{ runner.temp }}/dist/*.exe
          compression-level: 0
          retention-days: 30

  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the app's own Python
        run: |
          python -m pip install --quiet uv
          python -m uv python install "$PYTHON_VERSION" --install-dir "$RUNNER_TEMP/pythons"
      - name: Build the app and its disk image
        run: |
          PY="$(ls -d "$RUNNER_TEMP"/pythons/cpython-*-macos-aarch64-* | head -1)"
          python studio/packaging/build_app.py --python "$PY" --version "$VERSION" --out "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      - name: Install it as a buyer would (drag it from the disk image to Applications)
        run: |
          hdiutil attach "$RUNNER_TEMP/dist/CharacterStudio-$VERSION.dmg" -nobrowse -mountpoint /Volumes/CharacterStudio
          ls -la /Volumes/CharacterStudio
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "/Volumes/CharacterStudio/Character Studio.app" "$RUNNER_TEMP/Applications/Character Studio.app"
          hdiutil detach /Volumes/CharacterStudio
          plutil -p "$RUNNER_TEMP/Applications/Character Studio.app/Contents/Info.plist"
          codesign -dv "$RUNNER_TEMP/Applications/Character Studio.app/Contents/Resources/python/bin/python3" 2>&1 | head -4 || true
      - name: Start it as Finder does, first time (downloads its tools) and again
        env:
          CHARACTER_STUDIO_HOME: ${{ runner.temp }}/character-studio
        run: |
          APP="$RUNNER_TEMP/Applications/Character Studio.app"
          "$APP/Contents/MacOS/Character Studio" --self-test || { tail -60 "$CHARACTER_STUDIO_HOME/launcher.log"; exit 1; }
          # Moved (as from Downloads to Applications): it carries on with what it downloaded.
          mv "$APP" "$RUNNER_TEMP/Character Studio.app"
          "$RUNNER_TEMP/Character Studio.app/Contents/MacOS/Character Studio" --self-test || { tail -60 "$CHARACTER_STUDIO_HOME/launcher.log"; exit 1; }
          # The last start (after the move) installed nothing.
          if awk '/Character Studio starting/ {last = ""} {last = last $0 "\n"} END {printf "%s", last}' "$CHARACTER_STUDIO_HOME/launcher.log" | grep -q "pip install"; then
            echo "it downloaded again after moving"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: character-studio-mac-${{ env.VERSION }}
          path: ${{ runner.temp }}/dist/*.dmg
          compression-level: 0
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the app's own Python, appimagetool and the AppImage runtime
        run: |
          python -m pip install --quiet uv
          python -m uv python install "$PYTHON_VERSION" --install-dir "$RUNNER_TEMP/pythons"
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME_TAG/runtime-x86_64"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
      - name: Build the AppImage
        run: |
          PY="$(ls -d "$RUNNER_TEMP"/pythons/cpython-*-linux-x86_64-gnu | head -1)"
          python studio/packaging/build_app.py --python "$PY" --version "$VERSION" --out "$RUNNER_TEMP/dist" \
              --appimagetool "$RUNNER_TEMP/appimagetool" --appimage-runtime "$RUNNER_TEMP/runtime-x86_64"
          ls -l "$RUNNER_TEMP/dist"
      - name: The AppImage runtime's source code (published with the app, for its LGPL libfuse)
        run: |
          src="$RUNNER_TEMP/appimage-runtime-source"
          mkdir -p "$src"
          git clone -q --depth 1 --branch "$RUNTIME_TAG" https://github.com/AppImage/type2-runtime "$src/type2-runtime"
          test "$(git -C "$src/type2-runtime" rev-parse HEAD)" = "$RUNTIME_COMMIT"
          rm -rf "$src/type2-runtime/.git"
          # The libraries its build script uses, as it checks them.
          curl -fsSL -o "$src/fuse-3.15.0.tar.xz" https://github.com/libfuse/libfuse/releases/download/fuse-3.15.0/fuse-3.15.0.tar.xz
          echo "70589cfd5e1cff7ccd6ac91c86c01be340b227285c5e200baa284e401eea2ca0  $src/fuse-3.15.0.tar.xz" | sha256sum -c -
          curl -fsSL -o "$src/squashfuse-0.5.2.tar.gz" https://github.com/vasi/squashfuse/archive/0.5.2.tar.gz
          echo "db0238c5981dabbd80ee09ae15387f390091668ca060a7bc38047912491443d3  $src/squashfuse-0.5.2.tar.gz" | sha256sum -c -
          cp studio/packaging/appimage-runtime-licences.txt "$src/LICENCES.txt"
          tar -czf "$RUNNER_TEMP/dist/CharacterStudio-appimage-runtime-source.tar.gz" -C "$RUNNER_TEMP" appimage-runtime-source
          ls -l "$RUNNER_TEMP/dist"
      - name: Start it as a double-click does, first time (downloads its tools) and again
        env:
          CHARACTER_STUDIO_HOME: ${{ runner.temp }}/character-studio
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          IMAGE="$RUNNER_TEMP/dist/CharacterStudio-$VERSION-x86_64.AppImage"
          "$IMAGE" --self-test || { tail -60 "$CHARACTER_STUDIO_HOME/launcher.log"; exit 1; }
          "$IMAGE" --self-test || { tail -60 "$CHARACTER_STUDIO_HOME/launcher.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: character-studio-linux-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/dist/*.AppImage
            ${{ runner.temp }}/dist/*-source.tar.gz
          compression-level: 0
          retention-days: 30

  release:
    # The three apps, tested, on one GitHub release with names that stay the same from version to version.
    needs: [windows, mac, linux]
    if: github.event_name == 'workflow_dispatch' && inputs.release != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/apps
          pattern: character-studio-*-${{ env.VERSION }}
          merge-multiple: true
      - name: Put them on a release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release }}
        run: |
          cd "$RUNNER_TEMP/apps"
          mv "CharacterStudio-Setup-$VERSION.exe" CharacterStudio-Setup.exe
          mv "CharacterStudio-$VERSION.dmg" CharacterStudio.dmg
          mv "CharacterStudio-$VERSION-x86_64.AppImage" CharacterStudio-x86_64.AppImage
          sha256sum CharacterStudio-Setup.exe CharacterStudio.dmg CharacterStudio-x86_64.AppImage \
              CharacterStudio-appimage-runtime-source.tar.gz > SHA256SUMS.txt
          cat > notes.md <<EOF
          Character Studio $VERSION: make a character from a picture on your computer, then send it to the device.

          | Computer | Download |
          |---|---|
          | Windows 10 or 11 (64-bit) | **CharacterStudio-Setup.exe** |
          | Mac with Apple silicon (M1 or newer), macOS 12 or newer | **CharacterStudio.dmg** |
          | Linux (64-bit) | **CharacterStudio-x86_64.AppImage** |

          The first start downloads its AI tools once (about 1 GB; about 3 GB with an NVIDIA graphics card).
          Until the apps are signed, Windows and macOS warn about an app from a new publisher once: the user
          guide (docs/14-making-characters.md) says what to press.

          CharacterStudio-appimage-runtime-source.tar.gz is the source code of the AppImage runtime inside the
          Linux app, whose libfuse is under the GNU LGPL 2.1. SHA256SUMS.txt has the files' checksums.
          EOF
          # A draft of this version from an earlier run is replaced; a published one is never overwritten.
          old="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"studio-v$VERSION\") | \"\\(.id) \\(.draft)\"" | head -n 1)"
          if [ -n "$old" ]; then
            if [ "${old#* }" = true ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${old% *}"
              echo "Replaced the earlier draft of studio-v$VERSION."
            else
              echo "::error::studio-v$VERSION is already published: give this build a new version."
              exit 1
            fi
          fi
          flags="--draft"
          if [ "$MODE" = publish ]; then flags="--latest"; fi
          gh release create "studio-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Character Studio $VERSION" --notes-file notes.md $flags \
              CharacterStudio-Setup.exe CharacterStudio.dmg CharacterStudio-x86_64.AppImage \
              CharacterStudio-appimage-runtime-source.tar.gz SHA256SUMS.txt
          echo "### Character Studio $VERSION: release studio-v$VERSION ($MODE)" >> "$GITHUB_STEP_SUMMARY"
