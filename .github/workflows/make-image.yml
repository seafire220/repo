# Builds the ready-to-flash card image (docs/18-out-of-the-box.md) on GitHub, so it can be made without a
# Linux computer. Run it from the Actions tab: "Make a device image" -> "Run workflow". About half an hour.
#
# The image then goes on a GitHub release, "Device image <version>" (tag device-image-<version>, under
# Releases on the repository's front page): a draft only you can see until you publish it there (or
# choose "publish" here). Write companion-<version>.img.xz to a microSD card with Raspberry Pi Imager ("Use
# custom", and no customisation settings): docs/29-hardware-setup.md, "Units for sale: the ready-made image".
# With "none", the image is only on the run's page, under Artifacts, for 14 days.
#
# A second job then adds the source code of every operating-system package in the image to the same
# release (companion-<version>-source.tar.part00, ...), which the GNU GPL and LGPL require to be offered
# with the device. The device's notice sends buyers to that release (docs/34-licences.md): publish it
# before selling devices with this image, and keep it for at least three years after the last is sold.
#
# It runs on a 64-bit ARM machine, so the image is built natively, as on a Pi, without emulation. The image
# carries the update key and address from this repository; nothing secret goes into it.
name: Make a device image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The software's version in the image: numbers with dots, such as 2026.11.21 (updates you publish later must be newer)"
        required: true
        type: string
      writable_system:
        description: "The earlier layout, without power-cut protection (leave off)"
        required: false
        default: false
        type: boolean
      release:
        description: "The GitHub release: a draft to check first, published at once, or none (Artifacts only)"
        required: true
        default: draft
        type: choice
        options: [draft, publish, none]

permissions:
  contents: read

env:
  # Raspberry Pi OS Lite (64-bit), the release the device is built and tested on, with its published checksum.
  RASPIOS_URL: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-10-06/2026-10-06-raspios-trixie-arm64-lite.img.xz
  RASPIOS_SHA256: 483db18a48da399b5b7022ffae9a07bc6d99daab30e593aedac09b69ff422843

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: write          # for the release; the token is given to that step only
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,4}$'; then
            echo "::error::A version is numbers with dots, such as 2026.11.21"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mtools xz-utils file
          if command -v rustup >/dev/null; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build the screen program
        run: cd stage && cargo build --release

      - name: Check the screen program's licence list matches its libraries
        run: python3 stage/tools/notices.py --check

      - name: Download Raspberry Pi OS Lite
        run: |
          curl -fsSL -o "$RUNNER_TEMP/raspios.img.xz" "$RASPIOS_URL"
          echo "$RASPIOS_SHA256  $RUNNER_TEMP/raspios.img.xz" | sha256sum -c -

      - name: Build the image
        env:
          VERSION: ${{ inputs.version }}
          WRITABLE: ${{ inputs.writable_system }}
        run: |
          extra=""
          if [ "$WRITABLE" = true ]; then extra="--writable-system"; fi
          sudo ./device/build-image.sh "$RUNNER_TEMP/raspios.img.xz" "$RUNNER_TEMP/companion-$VERSION.img" \
              --version "$VERSION" --stage-binary stage/target/release/stage $extra
          sudo rm -f "$RUNNER_TEMP/raspios.img.xz"

      - name: Check the image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Also copies out its package list, for the source-code job.
          sudo ./device/check-image.sh "$RUNNER_TEMP/companion-$VERSION.img" --packages "$RUNNER_TEMP/packages"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/packages"

      - name: Compress it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          # The image was made by root: hand it (owner and group) to this user, or xz can't copy its group.
          sudo chown "$(id -u):$(id -g)" "companion-$VERSION.img"
          xz -T0 "companion-$VERSION.img"
          sha256sum "companion-$VERSION.img.xz" > "companion-$VERSION.img.xz.sha256"
          ls -l "companion-$VERSION.img.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: companion-image-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/companion-${{ inputs.version }}.img.xz
            ${{ runner.temp }}/companion-${{ inputs.version }}.img.xz.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: image-packages-${{ inputs.version }}
          path: ${{ runner.temp }}/packages
          retention-days: 30
          if-no-files-found: error

      - name: Put the image on a release
        if: inputs.release != 'none'
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || sudo apt-get install -y -q gh
          cd "$RUNNER_TEMP"
          if [ "$(stat -c %s "companion-$VERSION.img.xz")" -ge 2147483648 ]; then
            echo "::error::The image is 2 GB or more, which is more than a GitHub release file can be. It is under Artifacts."
            exit 1
          fi
          cat > notes.md <<EOF
          Card image for the device, software version $VERSION.

          **companion-$VERSION.img.xz**: write it to a microSD card with Raspberry Pi Imager: *Choose OS → Use custom*,
          pick this file, and say *No* to customisation (docs/29-hardware-setup.md, "Units for sale: the ready-made
          image"). Its checksum is in companion-$VERSION.img.xz.sha256.

          **companion-$VERSION-source.tar.part00, part01, ...** (added a little after the image): the source code of every
          operating-system package in the image, which the GNU GPL and LGPL require to be offered with the device.
          Join the parts, in order, into one file, then unpack it:
          - Linux or Mac: \`cat companion-$VERSION-source.tar.part* > companion-$VERSION-source.tar\`
          - Windows: \`copy /b companion-$VERSION-source.tar.part00 + companion-$VERSION-source.tar.part01 companion-$VERSION-source.tar\`

          Devices with this image send their owners here for the source code (settings page → Licences and notices).
          Publish this release before selling them, and keep it for at least three years after the last one is sold.
          EOF
          # A draft of this version from an earlier run is replaced; a published one is never overwritten.
          old="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"device-image-$VERSION\") | \"\\(.id) \\(.draft)\"" | head -n 1)"
          if [ -n "$old" ]; then
            if [ "${old#* }" = true ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${old% *}"
              echo "Replaced the earlier draft of device-image-$VERSION."
            else
              echo "::error::device-image-$VERSION is already published: give this build a new version."
              exit 1
            fi
          fi
          flags="--draft"
          if [ "$MODE" = publish ]; then flags=""; fi
          # Not the repository's "latest" release: that stays Character Studio's, for its download links.
          gh release create "device-image-$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Device image $VERSION" --notes-file notes.md --latest=false $flags \
              "companion-$VERSION.img.xz" "companion-$VERSION.img.xz.sha256"
          echo "### Device image $VERSION: release device-image-$VERSION ($MODE)" >> "$GITHUB_STEP_SUMMARY"

  sources:
    # The source code of the image's operating-system packages, on the image's release (docs/34-licences.md).
    needs: image
    if: inputs.release != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make room (the sources take a few GB, twice while they are packed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      - uses: actions/download-artifact@v4
        with:
          name: image-packages-${{ inputs.version }}
          path: ${{ runner.temp }}/packages

      - name: Download the source code of every package in the image
        run: |
          rc=0
          sudo python3 device/fetch-sources.py "$RUNNER_TEMP/packages" "$RUNNER_TEMP/source" || rc=$?
          # 3: some could not be found; they are listed in MISSING.txt and warned about. Anything else stops.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/source"
          du -sh "$RUNNER_TEMP/source"
          if [ -f "$RUNNER_TEMP/source/MISSING.txt" ]; then
            { echo "### Source packages not found"; echo '```'; cat "$RUNNER_TEMP/source/MISSING.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pack it in parts a release can hold, and add them to the image's release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          tar -cf - -C source . | split -b 1900m -d -a 2 - "companion-$VERSION-source.tar.part"
          rm -rf source
          sha256sum companion-"$VERSION"-source.tar.part* > "companion-$VERSION-source.sha256"
          ls -l companion-"$VERSION"-source.*
          gh release upload "device-image-$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              companion-"$VERSION"-source.tar.part* "companion-$VERSION-source.sha256"
